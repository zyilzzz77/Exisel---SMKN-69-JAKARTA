name: exisel-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exisel}
      POSTGRES_USER: ${POSTGRES_USER:-exisel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env.production}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exisel}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env.production}@database:5432/${POSTGRES_DB:-exisel}?schema=public
    command: ["pnpm", "db:migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - backend
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Isi NEXT_PUBLIC_APP_URL di .env.production}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exisel}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env.production}@database:5432/${POSTGRES_DB:-exisel}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Isi SESSION_SECRET di .env.production}
      SESSION_COOKIE_SECURE: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Isi NEXT_PUBLIC_APP_URL di .env.production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Isi GOOGLE_CLIENT_ID di .env.production}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Isi GOOGLE_CLIENT_SECRET di .env.production}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Isi GOOGLE_REDIRECT_URI di .env.production}
      GOOGLE_ALLOWED_EMAIL_DOMAIN: ${GOOGLE_ALLOWED_EMAIL_DOMAIN:-}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Isi DOMAIN di .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Isi ACME_EMAIL di .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  backend:
    internal: true
  edge:
